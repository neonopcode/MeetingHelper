<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP Demo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" class="app-logo" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.5 8.25L12 12.75L4.5 8.25M12 21.75L12 12.75M12 2.25L19.5 6.75L12 11.25L4.5 6.75L12 2.25Z" 
                          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 21.75L19.5 17.25L19.5 8.25M12 21.75L4.5 17.25L4.5 8.25" 
                          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>MVP Demo</h1>
        </div>

        <div class="grid" id="videoGrid">
            <div class="video-cell" style="position: relative">
                <video id="localView" autoplay playsinline></video>
                <div class="name-overlay">A</div>
            </div>
            <div class="video-cell" style="position: relative">
                <video id="remoteView" autoplay playsinline></video>
                <div class="name-overlay">B</div>
            </div>
        </div>
        
        <div class="controls">
            <button id="startButton">Start</button>
            <button id="stopButton" disabled>Stop</button>
            <button class="control-btn btn-panel" id="togglePanel">Script</button>
        </div>

        <div id="status" class="status">Ready to start</div>
        <div id="error" class="error"></div>
    </div>

    <div class="textcontainer">
        <div class="side-panel" id="scriptPanel">
            <h3>스크립트</h3>
            <div id="transcript">
            </div>
        </div>
        <aside class="ai-panel" id="agentPanel" aria-hidden="true" aria-labelledby="panelTitle">
            <div class="ai-panel-header">
                <h3 id="ai-panelTitle">🤖 AI Agent</h3>
                <div>
                    <button class="ai-btn copy" id="copyBtn" title="답변 복사">복사</button>
                    <button class="ai-btn close" id="closeBtn" aria-label="패널 닫기">닫기</button>
                </div>
            </div>

            <div class="ai-panel-content" id="panelContent" role="region" aria-live="polite">
                <div id="resultArea">
                    <!-- typing indicator -->
                    <div class="typing" id="typingIndicator" style="display:none;">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                        <div style="margin-left:8px;color:#475569;">Agent가 응답을 생성 중입니다...</div>
                    </div>

                    <!-- 실제 답변 -->
                    <div id="answerText" style="display:none;">
                    </div>

                </div>

                <div class="controls" style="margin-top:12px;">
                    <button class="ai-btn" id="saveBtn" style="background:#ecfccb;color:#0b1220">회의록에 저장</button>
                    <button class="ai-btn" id="openInKB" style="background:#e0f2fe;color:#073642">관련 문서 열기</button>
                </div>
            </div>
        </aside>
    </div>
    <script src="config.js"></script>
    <script src="app.js" type="module"></script>
</body>
</html>
